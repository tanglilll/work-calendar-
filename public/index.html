<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作日历</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="auth" class="auth" hidden>
  <div class="auth-card">
    <h1>工作日历</h1>
    <div class="tabs">
      <button type="button" class="tab is-active" data-auth-tab="login">登录</button>
      <button type="button" class="tab" data-auth-tab="apply">申请账号</button>
    </div>

    <!-- 字段级错误的落点：data-error-for 的名字必须与服务端 fields 的键一致（server/accounts.js 用 username / password / note），
         写由 public/util.js 的 setFieldErrors 负责（test/auth-form-errors.test.js 钉住）。 -->
    <form id="login-form" class="auth-form" autocomplete="on">
      <label>用户名<input name="username" autocomplete="username" required>
        <span class="field-error" data-error-for="username"></span>
      </label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required>
        <span class="field-error" data-error-for="password"></span>
      </label>
      <button type="submit" class="primary">登录</button>
      <p class="form-msg" data-msg data-kind="error"></p>
    </form>

    <form id="apply-form" class="auth-form" autocomplete="off" hidden>
      <label>用户名<input name="username" required>
        <span class="field-error" data-error-for="username"></span>
      </label>
      <!-- 密码规则与服务端同源：数字必须等于 server/config.js 的 LIMITS.PASSWORD_MIN（test/auth-form-errors.test.js 钉住） -->
      <label>密码<input name="password" type="password" minlength="8" required>
        <span class="field-error" data-error-for="password"></span>
      </label>
      <p class="hint">密码至少 8 位。</p>
      <label>备注<textarea name="note" rows="3" placeholder="说明你是谁，便于管理员核实"></textarea>
        <span class="field-error" data-error-for="note"></span>
      </label>
      <button type="submit" class="primary">提交申请</button>
      <p class="hint">提交后需管理员批准。批准之前不会创建账号，也无法登录。</p>
      <p class="form-msg" data-msg data-kind="error"></p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">工作日历</div>

    <div class="month-nav" id="month-nav">
      <button type="button" data-nav="prev" title="上一月">‹</button>
      <span id="month-label" class="month-label"></span>
      <button type="button" data-nav="next" title="下一月">›</button>
    </div>

    <!-- 视图切换：日历（默认）与表格。状态在 app.js 的 createState() 里（本地视图），
         切换只改 state.view 再重绘，不碰装载器 -->
    <div class="view-switch" id="view-switch" role="group" aria-label="视图切换">
      <button type="button" class="is-active" data-view="calendar">日历</button>
      <button type="button" data-view="table">表格</button>
    </div>

    <div class="topbar-right">
      <button type="button" id="btn-new" class="primary">+ 新建事项</button>
      <button type="button" id="btn-invites" hidden>邀请<span id="invite-count" class="badge"></span></button>
      <button type="button" id="btn-admin" hidden>管理</button>
      <span id="whoami" class="whoami"></span>
      <button type="button" id="btn-logout">登出</button>
    </div>
  </header>

  <main class="main">
    <div class="layout" id="calendar-view">
      <section class="calendar-wrap">
        <div class="weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div id="grid" class="grid"></div>
      </section>

      <aside class="sidebar">
        <section class="panel" id="panel-today"></section>
        <section class="panel" id="panel-due"></section>
        <section class="panel" id="panel-multi"></section>
      </aside>
    </div>

    <!-- 表格视图：与 .layout 并列，由顶栏的视图切换决定谁显示。
         内容全部由 public/tableview.js 渲染（工具栏 + 表体），这里只留容器 -->
    <section class="table-view" id="table-view" hidden>
      <div class="table-toolbar" id="table-toolbar"></div>
      <div class="table-body" id="table-body"></div>
    </section>
  </main>
</div>

<dialog id="item-dialog" class="dialog"></dialog>
<dialog id="invites-dialog" class="dialog"></dialog>
<dialog id="admin-dialog" class="dialog dialog-wide"></dialog>

<div id="toast" class="toast" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
